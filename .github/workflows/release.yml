name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version. Run scripts/release.sh first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Test, build, sign (ad-hoc) and verify
        run: scripts/package.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "release/ChunkCleaner-$VERSION-universal.dmg" \
            "release/ChunkCleaner-$VERSION-universal.dmg.sha256" \
            --title "ChunkCleaner $VERSION" \
            --generate-notes \
            --verify-tag
