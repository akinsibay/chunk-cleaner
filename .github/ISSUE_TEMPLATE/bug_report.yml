name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose folder ~/Projects
        2. Click Scan
        3. ...
  - type: input
    id: version
    attributes:
      label: ChunkCleaner version
      description: ChunkCleaner menu → About ChunkCleaner
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      placeholder: macOS 15.3, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - DMG from GitHub Releases
        - Homebrew
        - Built from source
