name: Feature request
description: Suggest an idea or a new ecosystem to detect
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new ecosystem, include the folder name and the marker file that proves it is safe to delete.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
